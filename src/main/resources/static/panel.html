<!DOCTYPE html>
<!--
  AutoDrive Motors - panel de gestión (aplicación de una sola página)
  Ruta: src/main/resources/static/panel.html

  Panel de gestión: Spring Boot lo entrega en http://localhost:8080/panel.html . Todo el contenido de las
  pantallas lo pinta js/app.js dentro de <main id="contenido">.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel de gestión · AutoDrive Motors</title>
  <meta name="description" content="Sistema de gestión vehicular de AutoDrive Motors: vehículos, clientes, ventas y mantenimientos.">

  <!-- Los colores del navegador siguen el tema del sistema (claro u oscuro) -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F131A" media="(prefers-color-scheme: dark)">

  <!-- Icono de pestaña: placa amarilla colombiana, sin archivo aparte -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='28' height='16' rx='3' fill='%23FCD116' stroke='%231C2430' stroke-width='2'/%3E%3Cpath d='M8 16h16' stroke='%231C2430' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- El orden importa: tokens (valores) -> base (estructura) -> componentes -->
  <link rel="stylesheet" href="css/tokens.css?v=2">
  <link rel="stylesheet" href="css/base.css?v=2">
  <link rel="stylesheet" href="css/components.css?v=2">
  <link rel="stylesheet" href="css/dashboard.css?v=2">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <div class="app">
    <!-- Móvil: pestañas abajo. Escritorio: carril de iconos a la izquierda. Un solo <nav>. -->
    <div class="lateral">
      <a class="marca" href="#/panel" aria-label="AutoDrive Motors, ir al panel principal">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
          <rect x="2.5" y="8" width="27" height="16" rx="3" fill="currentColor"/>
          <path d="M8 16h16" stroke="#1C2430" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </a>

      <nav class="navegacion" aria-label="Secciones principales">
        <ul class="navegacion__lista" id="menu-lista"></ul>
      </nav>
    </div>

    <div class="principal">
      <header class="barra">
        <p class="barra__marca">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
            <rect x="2.5" y="8" width="27" height="16" rx="3" fill="currentColor"/>
            <path d="M8 16h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <span><span class="barra__nombre">AutoDrive</span> <span class="barra__apellido">Motors</span></span>
        </p>
        <div class="usuario">
          <span class="usuario__datos">
            <span class="usuario__nombre">Administrador</span>
            <span class="usuario__rol">Panel de gestión</span>
          </span>
          <span class="usuario__avatar" aria-hidden="true">AD</span>
        </div>
      </header>

      <main class="contenido" id="contenido" tabindex="-1">
        <!-- Se muestra solo si JavaScript está desactivado o falla la carga del módulo -->
        <noscript>
          <p>Esta aplicación necesita JavaScript. Actívalo en tu navegador e intenta de nuevo.</p>
        </noscript>
      </main>
    </div>
  </div>

  <!-- Zona donde ui.js muestra las confirmaciones breves; los lectores de pantalla las anuncian -->
  <div class="avisos" id="avisos" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
